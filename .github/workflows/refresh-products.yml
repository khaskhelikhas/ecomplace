name: Refresh product data

# Runs the Firestore refresh script on a schedule (every 20 minutes) and
# on manual trigger. Requires repository secret FIREBASE_SERVICE_ACCOUNT
# containing the service account JSON (Project Settings -> Service Accounts
# -> Generate new private key).

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: ecomplace-app-4db34
  APP_URL: https://ecomplace-app-4db34.web.app

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: src/backend
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Write service account file
        run: printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"

      - name: Refresh Firestore data
        working-directory: src/backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          # --- Affiliate ids ---
          AMAZON_ASSOC_TAG: ${{ secrets.AMAZON_ASSOC_TAG }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
          WALMART_AFFILIATE_QS: ${{ secrets.WALMART_AFFILIATE_QS }}
          ALIEXPRESS_AFFILIATE_QS: ${{ secrets.ALIEXPRESS_AFFILIATE_QS }}
          GENERIC_AFFILIATE_QS: ${{ secrets.GENERIC_AFFILIATE_QS }}
          # --- Email alerts (Resend) ---
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          # --- Telegram channel broadcast ---
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # --- AliExpress Affiliate (Portals) API — real AliExpress products ---
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          ALIEXPRESS_KEYWORDS: ${{ secrets.ALIEXPRESS_KEYWORDS }}
          # --- Optional paid data sources ---
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: npm run refresh:firestore

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci || npm install

      - name: Build the app
        working-directory: src/frontend
        run: npm run build

      - name: Generate SEO deal pages + sitemap
        working-directory: src/backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npm run generate:seo

      - name: Deploy hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
