# Render.com Blueprint - deploys the EcomPlace backend API
# Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this repo to GitHub
#   2. Render dashboard -> New -> Blueprint -> pick the repo
#   3. Render reads this file and creates the service + disk
#   4. After it deploys, set FRONTEND_URL and JWT_SECRET (see below)

services:
  - type: web
    name: ecomplace-api
    runtime: node
    plan: free
    rootDir: src/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /data/ecomplace.sqlite
      - key: LOG_TO_FILE
        value: "false"
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret
      - key: FRONTEND_URL
        value: https://ecomplace-app.web.app,https://ecomplace-app.firebaseapp.com
      # Optional - add real product data later:
      # - key: KEEPA_API_KEY
      #   sync: false
      # - key: WALMART_API_KEY
      #   sync: false
      # - key: ALIEXPRESS_AFFILIATE_ID
      #   sync: false
    disk:
      name: ecomplace-data
      mountPath: /data
      sizeGB: 1
